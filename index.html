<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d61f26">
<title>Plump – resultattavla</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plump">
<style>
  :root{
    --bg:#f6f2ea; --card:#fffdf8; --ink:#241f19; --muted:#8a8377;
    --line:#e4ddcf; --accent:#d61f26; --accent-ink:#fff;
    --good:#1f7a4d; --shade:#f2ecdf; --faint:#cfc7b6;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15120e; --card:#1e1a15; --ink:#f2ede3; --muted:#a09889;
      --line:#342e26; --accent:#ef4a45; --accent-ink:#17110f;
      --good:#4cc38a; --shade:#241f19; --faint:#4a4238;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums lining-nums;
    -webkit-text-size-adjust:100%;
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation}

  .topbar{
    display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:var(--accent); color:var(--accent-ink);
  }
  .topbar h1{font-size:19px;margin:0;font-weight:900;letter-spacing:.18em;flex:1}
  .topbar .tools{display:flex;gap:8px}
  .topbar button{
    background:rgba(0,0,0,.16); color:inherit; border:0; border-radius:10px;
    padding:8px 11px; font-size:14px; font-weight:700;
  }
  .topbar button:disabled{opacity:.4}

  main{max-width:900px;margin:0 auto;padding:16px 14px 40px;width:100%}

  /* tabellvyer: tabellen scrollar för sig så rubriken alltid syns */
  body.board{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  body.board #game,body.board #history{
    flex:1;min-height:0;display:flex;flex-direction:column;
    padding:12px 14px calc(10px + env(safe-area-inset-bottom));
  }
  body.board .tablewrap{flex:0 1 auto;min-height:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 12px;font-weight:700}

  /* ---- Spelare ---- */
  .players{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .prow{display:flex;gap:8px;align-items:center}
  .prow .num{width:22px;color:var(--muted);text-align:right}
  .prow input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  .prow .del{background:none;border:0;color:var(--muted);font-size:22px;padding:4px 10px;line-height:1}
  .btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;font-weight:700}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;width:100%;padding:15px;font-size:17px}
  .btn.wide{width:100%}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row + .row{margin-top:12px}
  label.field{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  label.field.stack{display:block}
  label.field.stack span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
  select{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);max-width:100%}
  label.field.stack select{width:100%}
  .check{display:flex;align-items:center;gap:10px}
  .check input{width:20px;height:20px;accent-color:var(--accent)}
  .hint{color:var(--muted);font-size:13px;margin:10px 0 0}
  .seq{color:var(--muted);font-size:14px;margin-top:12px;line-height:1.5}
  .seq b{color:var(--ink)}
  .warnline{color:var(--accent);font-size:13px;font-weight:600;margin-top:6px}

  /* ---- Tidigare matcher ---- */
  .matches{display:flex;flex-direction:column;gap:8px}
  .match{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;
  }
  .match .body{flex:1;min-width:0}
  .match .top{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .match .bot{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .match .score{font-size:19px;font-weight:900}
  .match .chev{color:var(--muted);font-size:18px}
  .match.partial .top{font-weight:700;color:var(--muted)}

  /* ---- Tabell ---- */
  .tablewrap{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:auto; -webkit-overflow-scrolling:touch;
  }
  table.board{border-collapse:separate;border-spacing:0;width:100%}
  table.board th,table.board td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center}
  table.board th:last-child,table.board td:last-child{border-right:0}
  table.board tr:last-child td{border-bottom:0}

  table.board thead th{position:sticky;top:0;z-index:10;background:var(--card)}
  th.corner,td.cards{position:sticky;left:0;z-index:12;background:var(--shade);width:76px;min-width:76px}
  thead th.corner{z-index:20}
  th.name{padding:8px 6px 4px;min-width:80px}
  th.name .nm{font-size:14px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  th.name .tot{display:block;font-size:22px;font-weight:900;padding-bottom:6px}
  th.name.lead .tot{color:var(--good)}
  th.corner span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 4px;line-height:1.25}

  td.cards{padding:6px 4px}
  td.cards b{display:block;font-size:19px;font-weight:800}
  td.cards .giv{
    display:block;font-size:10px;color:var(--muted);font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  td.cards .giv i{font-style:normal;letter-spacing:.04em;opacity:.7}
  tr.active td.cards b,tr.active td.cards .giv{color:var(--accent)}

  td.cell{padding:0}
  td.cell button,td.cell .static{width:100%;border:0;background:none;padding:11px 2px 7px;display:block;position:relative}
  td.cell .pts{font-size:19px;font-weight:800;display:block;min-height:23px}
  td.cell .run{font-size:11px;color:var(--muted);display:block;min-height:14px}
  td.cell .deal{
    position:absolute;top:1px;left:4px;font-size:9px;font-weight:800;
    letter-spacing:.04em;color:var(--muted);opacity:.8;
  }
  tr.active td.cell .deal{color:var(--accent);opacity:1}
  td.cell.empty .pts{color:var(--faint);font-weight:400}
  td.cell.bidonly .pts{color:var(--muted);font-weight:600}
  td.cell.bidonly .run{color:var(--accent);font-weight:700}
  td.cell.plumped .pts{color:var(--accent);font-size:17px}
  tr.active td.cell{background:var(--shade)}
  td.cell.turn{box-shadow:inset 0 0 0 2px var(--accent)}
  /* tomma rutor som inte är i tur tonas ner så blicken hamnar på rätt ruta */
  tr.active td.cell.waiting button{opacity:.4}
  td.cell.over .pts{text-decoration:underline wavy var(--accent)}
  tr.locked td.cell button{cursor:default}

  /* ---- Nästa steg ---- */
  .next{
    margin-top:10px;width:100%;border:0;border-radius:var(--radius);
    background:var(--accent);color:var(--accent-ink);padding:14px 12px;
    font-size:16px;font-weight:800;text-align:center;
  }
  .next small{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:2px;letter-spacing:.03em}
  .next.done{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .banner{margin-top:10px;padding:14px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);text-align:center;font-weight:800}
  .banner small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:3px}
  .warn{margin-top:8px;color:var(--accent);font-size:13px;text-align:center}
  .legend{margin:8px 0 0;font-size:12px;color:var(--muted);text-align:center}
  .foot{display:flex;gap:10px;margin-top:10px}
  .foot .btn{flex:1;padding:11px 8px;font-size:14px}
  .foot .btn.on{border-color:var(--accent);color:var(--accent)}

  #toast{
    position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:60;max-width:92vw;
    background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;
    font-size:14px;font-weight:600;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);
  }

  /* ---- Väljare ---- */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .backdrop[hidden]{display:none}
  .sheet{
    background:var(--card);width:100%;max-width:520px;
    border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    animation:up .16s ease-out;
  }
  @keyframes up{from{transform:translateY(16px)}to{transform:none}}
  .sheet .meta{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
  .sheet .meta b{color:var(--accent)}
  .sheet h3{margin:2px 0 4px;font-size:22px;font-weight:800}
  .sheet .sub{margin:0 0 12px;font-size:13px;color:var(--muted)}
  .sheet .sub.block{color:var(--accent);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:9px}
  .grid.two{grid-template-columns:1fr 1fr}
  .grid button{
    border:1px solid var(--line);background:var(--bg);border-radius:12px;
    padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;
  }
  .grid button .k{font-size:11px;color:var(--muted);font-weight:600}
  .grid button .p{font-size:21px;font-weight:800}
  .grid button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .grid button.sel .k{color:inherit;opacity:.85}
  .grid button:disabled{opacity:.35;cursor:default}
  .grid button.made{border-color:var(--good)}
  .grid button.made .p{color:var(--good)}
  .grid button.plump{border-color:var(--accent)}
  .grid button.plump .p{color:var(--accent)}
  .grid.two button{padding:14px 6px;min-width:0}
  .grid.two button .p{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grid button.turnpick .p{font-size:18px}
  .sheet .order{
    margin:0 0 12px;font-size:13px;color:var(--ink);font-weight:600;
    background:var(--shade);border-radius:10px;padding:9px 11px;line-height:1.5;
  }
  .sheet .order b{color:var(--accent)}
  .sheet .order i{font-style:normal;color:var(--muted);font-weight:600}
  .sheet .extras{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}
  .sheet .extras button{
    flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);
    background:var(--bg);font-weight:700;font-size:14px;
  }
</style>
</head>
<body>

<header class="topbar">
  <h1>PLUMP</h1>
  <div class="tools">
    <button id="undoBtn" type="button" hidden>Ångra</button>
    <button id="editBtn" type="button" hidden>Spelare</button>
  </div>
</header>

<!-- ============ START ============ -->
<main id="setup">
  <div class="panel">
    <h2>Spelare</h2>
    <div class="players" id="playerList"></div>
    <button class="btn wide" id="addPlayer" type="button">+ Lägg till spelare</button>
    <div class="row" style="margin-top:14px">
      <label class="field stack"><span>Först att ge</span>
        <select id="dealer"></select>
      </label>
    </div>
    <p class="hint">Den som ger bjuder sist, och nästa runda ger nästa spelare.</p>
  </div>

  <div class="panel">
    <h2>Rundor</h2>
    <div class="row">
      <label class="field stack"><span>Flest kort</span>
        <select id="maxCards"></select>
      </label>
      <label class="field stack"><span>Vänder vid</span>
        <select id="minCards"></select>
      </label>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="upAgain" checked> …och upp igen</label>
    </div>
    <div class="seq" id="seqPreview"></div>
    <p class="hint">Poäng: plump = 0 p · klarat bud = 10 + budet (1&nbsp;→&nbsp;11, 8&nbsp;→&nbsp;18) · klarad nolla = 5 p.</p>
  </div>

  <button class="btn primary" id="startBtn" type="button">Starta match</button>
  <button class="btn wide" id="backBtn" type="button" hidden style="margin-top:10px">← Tillbaka till matchen</button>

  <div class="panel" id="historyPanel" hidden style="margin-top:16px">
    <h2>Tidigare matcher</h2>
    <div class="matches" id="matchList"></div>
    <button class="btn wide" id="clearHistory" type="button" style="margin-top:12px">Rensa historiken</button>
  </div>
</main>

<!-- ============ SPEL ============ -->
<main id="game" hidden>
  <div class="tablewrap">
    <table class="board" id="board"></table>
  </div>
  <button class="next" id="nextBtn" type="button"></button>
  <div id="banner" class="banner" hidden></div>
  <div id="warn" class="warn" hidden></div>
  <p class="legend">● = plump (0 p) · grå siffra = lagt bud · <b>ger</b> = delar ut korten</p>
  <div class="foot">
    <button class="btn" id="fixBtn" type="button">Rätta äldre</button>
    <button class="btn" id="newSame" type="button">Ny match</button>
    <button class="btn" id="reset" type="button">Rensa allt</button>
  </div>
</main>

<!-- ============ HISTORIK ============ -->
<main id="history" hidden>
  <div class="tablewrap">
    <table class="board" id="histBoard"></table>
  </div>
  <div id="histInfo" class="banner"></div>
  <p class="legend">● = plump (0 p) · <b>ger</b> = delade ut korten</p>
  <div class="foot">
    <button class="btn" id="histBack" type="button">← Tillbaka</button>
    <button class="btn" id="histDelete" type="button">Ta bort matchen</button>
  </div>
</main>

<div id="toast" hidden></div>

<!-- ============ VÄLJARE ============ -->
<div class="backdrop" id="backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="meta" id="sheetMeta"></div>
    <h3 id="sheetTitle"></h3>
    <p class="sub" id="sheetSub"></p>
    <p class="order" id="sheetOrder" hidden></p>
    <div class="grid" id="sheetGrid"></div>
    <div class="extras" id="sheetExtras"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var KEY = "plump-state-v4";
  var MAX_PLAYERS = 10;
  var MAX_HISTORY = 25;

  /* localStorage om det går, annars minne (privat läge, blockerade cookies) */
  var store = (function(){
    try{
      var t = "__plump_test__";
      localStorage.setItem(t,"1"); localStorage.removeItem(t);
      return localStorage;
    }catch(e){
      var mem = {};
      return {
        getItem:function(k){ return (k in mem) ? mem[k] : null; },
        setItem:function(k,v){ mem[k] = String(v); },
        removeItem:function(k){ delete mem[k]; }
      };
    }
  })();

  function blank(){
    return { v:4, players:["",""], playerCount:0, firstDealer:0,
             rounds:[], cells:{}, started:false, matchId:1, archive:[] };
  }
  function save(){ try{ store.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function load(){
    try{
      var raw = store.getItem(KEY);
      if(!raw) return null;
      var s = JSON.parse(raw);
      if(!s || s.v !== 4 || !Array.isArray(s.players)) return null;
      s.cells = s.cells || {};
      s.rounds = s.rounds || [];
      s.firstDealer = s.firstDealer || 0;
      s.archive = Array.isArray(s.archive) ? s.archive : [];
      s.matchId = s.matchId || 1;
      if(typeof s.playerCount !== "number") s.playerCount = s.players.length;
      return s;
    }catch(e){ return null; }
  }

  var state = load() || blank();
  var history = [];       // för Ångra
  var fixMode = false;    // tillåt rättning i äldre rundor
  var viewing = null;     // arkiverad match som visas just nu
  var toastTimer = null;

  /* ---------- rutor och poäng ----------
     En ruta är {b:bud, m:null|true|false}. m=null betyder att budet är lagt
     men handen inte spelad än. Hjälpfunktionerna tar emot en "match" (g) med
     players, rounds, cells och firstDealer, så samma kod ritar både den
     pågående matchen och en arkiverad. */
  function key(r,p){ return r + ":" + p; }
  function cellOf(g,r,p){ return g.cells[key(r,p)] || null; }
  function pointsOf(c){
    if(!c || c.m === null || c.m === undefined) return null;
    if(c.m === false) return 0;
    return c.b === 0 ? 5 : 10 + c.b;
  }
  function totalAfter(g, p, r){
    var sum = 0;
    for(var i=0;i<=r;i++){
      var pts = pointsOf(cellOf(g,i,p));
      if(pts !== null) sum += pts;
    }
    return sum;
  }
  function totalOf(g, p){ return totalAfter(g, p, g.rounds.length - 1); }
  function totalsOf(g){ return g.players.map(function(_,p){ return totalOf(g,p); }); }

  function buildSequence(max, min, upAgain){
    var seq = [], i;
    if(min > max) min = max;
    for(i=max;i>=min;i--) seq.push(i);
    if(upAgain) for(i=min+1;i<=max;i++) seq.push(i);
    return seq;
  }

  /* ---------- givare och budordning ---------- */
  function dealerIdx(g,r){ return (g.firstDealer + r) % g.players.length; }
  function dealerName(g,r){ return g.players[dealerIdx(g,r)] || ""; }
  /* Den som sitter efter given bjuder först, given bjuder sist. */
  function bidOrder(g,r){
    var n = g.players.length, out = [];
    for(var k=1;k<=n;k++) out.push((g.firstDealer + r + k) % n);
    return out;
  }
  function bidSum(g,r,exceptP){
    var s = 0;
    for(var p=0;p<g.players.length;p++){
      if(p === exceptP) continue;
      var c = cellOf(g,r,p);
      if(c) s += c.b;
    }
    return s;
  }
  function othersAllBid(g,r,p){
    for(var i=0;i<g.players.length;i++){
      if(i !== p && !cellOf(g,r,i)) return false;
    }
    return true;
  }
  /* Given får inte bjuda så att budsumman blir exakt antalet kort. */
  function forbiddenBid(g,r,p){
    if(p !== dealerIdx(g,r) || !othersAllBid(g,r,p)) return null;
    var f = g.rounds[r] - bidSum(g,r,p);
    return (f >= 0 && f <= g.rounds[r]) ? f : null;
  }
  /* stick som är kända: bara klarade bud skrivs upp */
  function knownTricks(g,r){
    var s = 0;
    for(var p=0;p<g.players.length;p++){
      var c = cellOf(g,r,p);
      if(c && c.m === true) s += c.b;
    }
    return s;
  }
  function nextBid(g,r){
    var order = bidOrder(g,r);
    for(var i=0;i<order.length;i++) if(!cellOf(g,r,order[i])) return order[i];
    return null;
  }
  function nextResult(g,r){
    var order = bidOrder(g,r);
    for(var i=0;i<order.length;i++){
      var c = cellOf(g,r,order[i]);
      if(c && (c.m === null || c.m === undefined)) return order[i];
    }
    return null;
  }
  function roundDone(g,r){ return nextBid(g,r) === null && nextResult(g,r) === null; }
  function currentRound(g){
    for(var r=0;r<g.rounds.length;r++) if(!roundDone(g,r)) return r;
    return -1;
  }
  function hasCells(g){ for(var k in g.cells) return true; return false; }

  var el = {
    setup:document.getElementById("setup"),
    game:document.getElementById("game"),
    historyView:document.getElementById("history"),
    playerList:document.getElementById("playerList"),
    addPlayer:document.getElementById("addPlayer"),
    dealer:document.getElementById("dealer"),
    maxCards:document.getElementById("maxCards"),
    minCards:document.getElementById("minCards"),
    upAgain:document.getElementById("upAgain"),
    seqPreview:document.getElementById("seqPreview"),
    startBtn:document.getElementById("startBtn"),
    backBtn:document.getElementById("backBtn"),
    historyPanel:document.getElementById("historyPanel"),
    matchList:document.getElementById("matchList"),
    clearHistory:document.getElementById("clearHistory"),
    board:document.getElementById("board"),
    nextBtn:document.getElementById("nextBtn"),
    banner:document.getElementById("banner"),
    warn:document.getElementById("warn"),
    undoBtn:document.getElementById("undoBtn"),
    editBtn:document.getElementById("editBtn"),
    fixBtn:document.getElementById("fixBtn"),
    newSame:document.getElementById("newSame"),
    reset:document.getElementById("reset"),
    histBoard:document.getElementById("histBoard"),
    histInfo:document.getElementById("histInfo"),
    histBack:document.getElementById("histBack"),
    histDelete:document.getElementById("histDelete"),
    toast:document.getElementById("toast"),
    backdrop:document.getElementById("backdrop"),
    sheetMeta:document.getElementById("sheetMeta"),
    sheetTitle:document.getElementById("sheetTitle"),
    sheetSub:document.getElementById("sheetSub"),
    sheetOrder:document.getElementById("sheetOrder"),
    sheetGrid:document.getElementById("sheetGrid"),
    sheetExtras:document.getElementById("sheetExtras")
  };

  for(var n=1;n<=13;n++){
    var o = document.createElement("option");
    o.value = n; o.textContent = n + " kort";
    el.maxCards.appendChild(o);
  }
  el.maxCards.value = 8;

  function toast(msg){
    el.toast.textContent = msg;
    el.toast.hidden = false;
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.toast.hidden = true; }, 2600);
  }

  /* ---------- tabellen ----------
     Ritas likadant för pågående match och arkiverad; opts.onCell saknas när
     tavlan bara ska läsas. */
  function buildBoard(g, opts){
    opts = opts || {};
    var totals = totalsOf(g);
    var best = Math.max.apply(null, totals);

    var t = document.createElement("table");
    t.className = "board";

    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    var corner = document.createElement("th");
    corner.className = "corner";
    corner.innerHTML = "<span>Kort</span>";
    hr.appendChild(corner);
    g.players.forEach(function(name,p){
      var th = document.createElement("th");
      th.className = "name" + (totals[p] === best && best > 0 ? " lead" : "");
      var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = name;
      var tot = document.createElement("span"); tot.className = "tot"; tot.textContent = totals[p];
      th.appendChild(nm); th.appendChild(tot);
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    t.appendChild(thead);

    var tbody = document.createElement("tbody");
    g.rounds.forEach(function(cards, r){
      var tr = document.createElement("tr");
      var isActive = r === opts.active;
      tr.className = (isActive ? "active" : "") +
                     (opts.onCell && !isActive && !opts.unlocked ? " locked" : "");

      var td0 = document.createElement("td");
      td0.className = "cards";
      var b = document.createElement("b"); b.textContent = cards;
      var giv = document.createElement("span"); giv.className = "giv";
      var i = document.createElement("i"); i.textContent = "ger ";
      giv.appendChild(i);
      giv.appendChild(document.createTextNode(dealerName(g,r)));
      td0.appendChild(b); td0.appendChild(giv);
      tr.appendChild(td0);

      var over = knownTricks(g,r) > cards;
      var dealer = dealerIdx(g,r);

      g.players.forEach(function(_,p){
        var c = cellOf(g,r,p);
        var pending = c && (c.m === null || c.m === undefined);
        var td = document.createElement("td");
        var isTurn = isActive && p === opts.turnP;
        td.className = "cell" +
          (!c ? " empty" : (pending ? " bidonly" : (c.m === false ? " plumped" : ""))) +
          (over ? " over" : "") +
          (isTurn ? " turn" : "") +
          (isActive && !isTurn && !c && opts.turnP !== null && opts.turnP !== undefined ? " waiting" : "");

        var inner = document.createElement(opts.onCell ? "button" : "div");
        if(opts.onCell) inner.type = "button"; else inner.className = "static";

        if(p === dealer){
          var d = document.createElement("span");
          d.className = "deal"; d.textContent = "ger";
          d.setAttribute("aria-label", "ger korten");
          inner.appendChild(d);
        }
        var pts = document.createElement("span"); pts.className = "pts";
        var run = document.createElement("span"); run.className = "run";
        if(!c){
          pts.textContent = "–"; run.textContent = "";
        } else if(pending){
          pts.textContent = c.b; run.textContent = "bud";
        } else {
          pts.textContent = c.m === false ? "●" : pointsOf(c);
          run.textContent = totalAfter(g, p, r);
        }
        inner.appendChild(pts); inner.appendChild(run);
        if(opts.onCell){
          inner.addEventListener("click", function(){ opts.onCell(r,p); });
        }
        td.appendChild(inner);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    return t;
  }

  function winnersOf(g){
    var totals = totalsOf(g);
    var best = Math.max.apply(null, totals);
    return { best: best, names: g.players.filter(function(_,p){ return totals[p] === best; }) };
  }

  /* ---------- STARTVYN ---------- */
  function nameOf(i){ return (state.players[i] || "").trim() || ("Spelare " + (i+1)); }

  function renderPlayers(){
    el.playerList.innerHTML = "";
    state.players.forEach(function(name, i){
      var row = document.createElement("div");
      row.className = "prow";

      var num = document.createElement("span");
      num.className = "num"; num.textContent = (i+1) + ".";

      var inp = document.createElement("input");
      inp.type = "text"; inp.value = name;
      inp.placeholder = "Spelare " + (i+1);
      inp.autocomplete = "off";
      inp.addEventListener("input", function(){
        state.players[i] = inp.value; save(); renderDealer();
      });

      var del = document.createElement("button");
      del.className = "del"; del.type = "button"; del.textContent = "×";
      del.setAttribute("aria-label", "Ta bort spelare " + (i+1));
      del.addEventListener("click", function(){
        if(state.players.length <= 2) return;
        state.players.splice(i,1);
        if(state.firstDealer >= state.players.length) state.firstDealer = 0;
        save(); renderPlayers(); updateSetupHint();
      });

      row.appendChild(num); row.appendChild(inp); row.appendChild(del);
      el.playerList.appendChild(row);
    });
    el.addPlayer.disabled = state.players.length >= MAX_PLAYERS;
    renderDealer();
    updateSetupHint();
  }

  function renderDealer(){
    if(state.firstDealer >= state.players.length) state.firstDealer = 0;
    el.dealer.innerHTML = "";
    state.players.forEach(function(_, i){
      var o = document.createElement("option");
      o.value = i; o.textContent = nameOf(i);
      if(i === state.firstDealer) o.selected = true;
      el.dealer.appendChild(o);
    });
  }

  function maxCardsForPlayers(){
    return Math.max(1, Math.min(13, Math.floor(52 / state.players.length)));
  }

  function updateSetupHint(){
    var cap = maxCardsForPlayers();
    Array.prototype.forEach.call(el.maxCards.options, function(o){
      o.disabled = Number(o.value) > cap;
    });
    if(Number(el.maxCards.value) > cap) el.maxCards.value = cap;

    var max = Number(el.maxCards.value);
    var wantMin = Number(el.minCards.value) || 2;
    el.minCards.innerHTML = "";
    for(var i=1;i<=max;i++){
      var o = document.createElement("option");
      o.value = i; o.textContent = i + " kort";
      el.minCards.appendChild(o);
    }
    el.minCards.value = Math.min(wantMin, max);

    var seq = buildSequence(max, Number(el.minCards.value), el.upAgain.checked);
    el.seqPreview.innerHTML = "";
    var b = document.createElement("b");
    b.textContent = seq.length + " rundor: ";
    el.seqPreview.appendChild(b);
    el.seqPreview.appendChild(document.createTextNode(seq.join(" · ")));
    if(max === cap && cap < 13){
      var w = document.createElement("div");
      w.className = "warnline";
      w.textContent = "Kortleken räcker till max " + cap + " kort med " + state.players.length + " spelare.";
      el.seqPreview.appendChild(w);
    }
  }

  el.addPlayer.addEventListener("click", function(){
    if(state.players.length >= MAX_PLAYERS) return;
    state.players.push(""); save(); renderPlayers();
    var inputs = el.playerList.querySelectorAll("input");
    inputs[inputs.length-1].focus();
  });
  el.dealer.addEventListener("change", function(){
    state.firstDealer = Number(el.dealer.value) || 0; save();
  });
  el.maxCards.addEventListener("change", updateSetupHint);
  el.minCards.addEventListener("change", updateSetupHint);
  el.upAgain.addEventListener("change", updateSetupHint);

  function showSetup(){
    viewing = null;
    el.game.hidden = true; el.historyView.hidden = true; el.setup.hidden = false;
    el.editBtn.hidden = true; el.undoBtn.hidden = true;
    document.body.classList.remove("board");
    el.backBtn.hidden = !(state.rounds.length && hasCells(state));
    el.startBtn.textContent = el.backBtn.hidden ? "Starta match" : "Starta om matchen";
    renderPlayers();
    renderMatchList();
  }

  el.startBtn.addEventListener("click", function(){
    if(hasCells(state) && !confirm("Starta om? Alla poäng nollställs.")) return;
    archiveCurrent();
    state.players = state.players.map(function(_,i){ return nameOf(i); });
    state.rounds = buildSequence(Number(el.maxCards.value), Number(el.minCards.value), el.upAgain.checked);
    state.playerCount = state.players.length;
    state.cells = {};
    state.matchId = (state.matchId || 1) + 1;
    state.started = true;
    history = []; fixMode = false;
    save(); renderGame();
  });

  el.backBtn.addEventListener("click", function(){
    if(state.players.length !== state.playerCount){
      alert("Antalet spelare har ändrats. Tryck på ”Starta om matchen” för att spela med den nya uppställningen – då nollställs poängen.");
      return;
    }
    state.players = state.players.map(function(_,i){ return nameOf(i); });
    state.started = true; save(); renderGame();
  });

  /* ---------- ARKIV ---------- */
  function stamp(){
    try{
      return new Date().toISOString();
    }catch(e){ return ""; }
  }
  function prettyDate(iso){
    if(!iso) return "";
    try{
      var d = new Date(iso);
      return d.toLocaleDateString("sv-SE", {day:"numeric", month:"short"}) + " " +
             d.toLocaleTimeString("sv-SE", {hour:"2-digit", minute:"2-digit"});
    }catch(e){ return ""; }
  }
  /* Sparar den pågående matchen i arkivet, eller uppdaterar posten om den
     redan ligger där (matchen kan ju rättas efter att den blivit klar). */
  function archiveCurrent(){
    if(!state.rounds.length || !hasCells(state)) return;
    var w = winnersOf(state);
    var entry = {
      id: state.matchId,
      ts: stamp(),
      players: state.players.slice(),
      rounds: state.rounds.slice(),
      firstDealer: state.firstDealer,
      cells: JSON.parse(JSON.stringify(state.cells)),
      totals: totalsOf(state),
      winners: w.names,
      best: w.best,
      done: currentRound(state) === -1
    };
    var at = -1;
    for(var i=0;i<state.archive.length;i++){
      if(state.archive[i].id === entry.id){ at = i; break; }
    }
    if(at >= 0){
      entry.ts = state.archive[at].ts || entry.ts;   // behåll ursprungstiden
      state.archive[at] = entry;
    } else {
      state.archive.unshift(entry);
      if(state.archive.length > MAX_HISTORY) state.archive.length = MAX_HISTORY;
    }
    save();
  }

  function renderMatchList(){
    var list = state.archive || [];
    el.historyPanel.hidden = list.length === 0;
    el.matchList.innerHTML = "";
    list.forEach(function(m){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "match" + (m.done ? "" : " partial");

      var body = document.createElement("div"); body.className = "body";
      var top = document.createElement("div"); top.className = "top";
      top.textContent = m.done
        ? "🏆 " + m.winners.join(" & ")
        : "Avbruten match";
      var bot = document.createElement("div"); bot.className = "bot";
      bot.textContent = prettyDate(m.ts) + " · " + m.players.join(", ");
      body.appendChild(top); body.appendChild(bot);

      var score = document.createElement("span");
      score.className = "score"; score.textContent = m.best;
      var chev = document.createElement("span");
      chev.className = "chev"; chev.textContent = "›";

      b.appendChild(body); b.appendChild(score); b.appendChild(chev);
      b.addEventListener("click", function(){ showHistory(m); });
      el.matchList.appendChild(b);
    });
  }

  function showHistory(m){
    viewing = m;
    el.setup.hidden = true; el.game.hidden = true; el.historyView.hidden = false;
    el.editBtn.hidden = true; el.undoBtn.hidden = true;
    document.body.classList.add("board");

    var t = buildBoard(m, {});
    el.histBoard.replaceWith(t);
    t.id = "histBoard"; el.histBoard = t;

    el.histInfo.innerHTML = "";
    var head = document.createElement("span");
    head.textContent = m.done
      ? "🏆 " + m.winners.join(" & ") + " – " + m.best + " poäng"
      : "Avbruten match";
    var sub = document.createElement("small");
    sub.textContent = prettyDate(m.ts) + " · " +
                      m.rounds.length + (m.rounds.length === 1 ? " runda · " : " rundor · ") +
                      m.players.length + " spelare";
    el.histInfo.appendChild(head); el.histInfo.appendChild(sub);
  }

  el.histBack.addEventListener("click", showSetup);
  el.histDelete.addEventListener("click", function(){
    if(!viewing) return;
    if(!confirm("Ta bort den här matchen ur historiken?")) return;
    state.archive = state.archive.filter(function(m){ return m.id !== viewing.id; });
    save(); showSetup();
  });
  el.clearHistory.addEventListener("click", function(){
    if(!confirm("Rensa hela historiken? Pågående match påverkas inte.")) return;
    state.archive = []; save(); renderMatchList();
  });

  /* ---------- SPELVYN ---------- */
  function renderGame(){
    viewing = null;
    el.setup.hidden = true; el.historyView.hidden = true;
    el.game.hidden = false;
    document.body.classList.add("board");
    el.editBtn.hidden = false;
    el.undoBtn.hidden = false;
    el.undoBtn.disabled = history.length === 0;
    el.fixBtn.className = "btn" + (fixMode ? " on" : "");
    el.fixBtn.textContent = fixMode ? "Rättning på" : "Rätta äldre";

    var active = currentRound(state);
    var turnBid = active === -1 ? null : nextBid(state, active);
    var turnRes = active === -1 ? null : nextResult(state, active);
    // buden läggs klart först, så bara ett av stegen står i tur
    var turnP = turnBid !== null ? turnBid : turnRes;

    var t = buildBoard(state, {
      active: active, turnP: turnP, unlocked: fixMode, onCell: tapCell
    });
    el.board.replaceWith(t);
    t.id = "board"; el.board = t;

    var activeRow = t.querySelector("tr.active");
    if(activeRow && activeRow.scrollIntoView) activeRow.scrollIntoView({block:"nearest"});

    renderNext(active, turnBid, turnRes);

    var bad = [];
    state.rounds.forEach(function(cards,r){ if(knownTricks(state,r) > cards) bad.push(r+1); });
    if(bad.length){
      el.warn.hidden = false;
      el.warn.textContent = "Obs: fler klarade stick än kort i runda " + bad.join(", ") + ".";
    } else el.warn.hidden = true;

    if(active === -1){
      var w = winnersOf(state);
      el.banner.hidden = false;
      el.banner.textContent = "🏆 " + w.names.join(" & ") + " vinner med " + w.best + " poäng!";
      archiveCurrent();
    } else {
      el.banner.hidden = true;
    }
  }

  function renderNext(active, turnBid, turnRes){
    el.nextBtn.innerHTML = "";
    if(active === -1){
      el.nextBtn.className = "next done";
      el.nextBtn.textContent = "Matchen är slut";
      el.nextBtn.disabled = true;
      return;
    }
    el.nextBtn.className = "next";
    el.nextBtn.disabled = false;
    var cards = state.rounds[active];
    var main = document.createElement("span");
    var sub = document.createElement("small");
    if(turnBid !== null){
      main.textContent = "Bud: " + state.players[turnBid];
      sub.textContent = "Runda " + (active+1) + " · " + cards + " kort · " +
                        dealerName(state,active) + " ger · budsumma hittills " +
                        bidSum(state, active, -1);
    } else {
      main.textContent = "Resultat: " + state.players[turnRes];
      sub.textContent = "Runda " + (active+1) + " · " + cards + " kort · " +
                        dealerName(state,active) + " ger · bjöd " +
                        cellOf(state,active,turnRes).b;
    }
    el.nextBtn.appendChild(main);
    el.nextBtn.appendChild(sub);
    el.nextBtn.onclick = function(){
      if(turnBid !== null) openSheet(active, turnBid, "bud");
      else openSheet(active, turnRes, "resultat");
    };
  }

  function tapCell(r,p){
    var active = currentRound(state);
    if(fixMode){
      var c = cellOf(state,r,p);
      openSheet(r, p, c ? "resultat" : "bud");
      return;
    }
    if(r !== active){
      toast(active === -1
        ? "Matchen är slut. Tryck ”Rätta äldre” för att ändra."
        : "Bara runda " + (active+1) + " kan fyllas i. Tryck ”Rätta äldre” för att ändra.");
      return;
    }
    // ordningen är den vanligaste felkällan: trycker man på fel spelare öppnas
    // inte den rutan, utan en fråga som pekar på rätt spelare
    var turnBid = nextBid(state,r);
    var phase = turnBid !== null ? "bud" : "resultat";
    var turnP = turnBid !== null ? turnBid : nextResult(state,r);
    if(turnP !== null && p !== turnP){
      openTurnWarning(r, p, turnP, phase);
      return;
    }
    openSheet(r, p, phase);
  }

  /* Visar vem som egentligen är i tur, med turordningen utskriven. Man kan
     fortfarande välja fel spelare, men bara med ett medvetet tryck. */
  function openTurnWarning(r, tapped, turnP, phase){
    sheetHead(r);
    el.sheetGrid.innerHTML = "";
    el.sheetExtras.innerHTML = "";
    el.sheetSub.className = "sub";
    el.sheetTitle.textContent = phase === "bud"
      ? state.players[turnP] + " är i tur att bjuda"
      : state.players[turnP] + " är i tur – fyll i resultatet";
    el.sheetSub.textContent = phase === "bud"
      ? "Den som sitter efter given bjuder först, given bjuder sist."
      : "Resultaten fylls i samma ordning som buden lades.";
    renderOrder(r, turnP);

    el.sheetGrid.className = "grid two";
    var right = document.createElement("button");
    right.type = "button";
    right.className = "turnpick sel";
    right.innerHTML = '<span class="p"></span><span class="k">' +
      (phase === "bud" ? "bjuder nu" : "fyll i resultat") + '</span>';
    right.querySelector(".p").textContent = state.players[turnP];
    right.addEventListener("click", function(){ openSheet(r, turnP, phase); });
    el.sheetGrid.appendChild(right);

    var anyway = document.createElement("button");
    anyway.type = "button";
    anyway.className = "turnpick";
    anyway.innerHTML = '<span class="p"></span><span class="k">fyll i ändå</span>';
    anyway.querySelector(".p").textContent = state.players[tapped];
    anyway.addEventListener("click", function(){ openSheet(r, tapped, phase); });
    el.sheetGrid.appendChild(anyway);

    addExtra("Stäng", closeSheet);
    el.backdrop.hidden = false;
  }

  /* "Anna → Kalle → Tim (ger)" med den som är i tur markerad */
  function renderOrder(r, turnP){
    var order = bidOrder(state,r);
    var dealer = dealerIdx(state,r);
    el.sheetOrder.innerHTML = "";
    el.sheetOrder.hidden = false;
    order.forEach(function(p, i){
      if(i) el.sheetOrder.appendChild(document.createTextNode(" → "));
      var node = document.createElement(p === turnP ? "b" : "span");
      node.textContent = state.players[p];
      el.sheetOrder.appendChild(node);
      if(p === dealer){
        var d = document.createElement("i");
        d.textContent = " (ger)";
        el.sheetOrder.appendChild(d);
      }
    });
  }

  /* ---------- väljaren ---------- */
  function sheetHead(r){
    el.sheetMeta.innerHTML = "";
    el.sheetMeta.appendChild(document.createTextNode(
      "Runda " + (r+1) + " av " + state.rounds.length + " · " + state.rounds[r] + " kort · "));
    var d = document.createElement("b"); d.textContent = dealerName(state,r);
    el.sheetMeta.appendChild(d);
    el.sheetMeta.appendChild(document.createTextNode(" ger"));
  }

  function openSheet(r,p,step){
    var cards = state.rounds[r];
    var c = cellOf(state,r,p);
    if(step === "resultat" && !c) step = "bud";

    sheetHead(r);
    renderOrder(r, p);
    el.sheetGrid.innerHTML = "";
    el.sheetExtras.innerHTML = "";
    el.sheetSub.className = "sub";

    if(step === "bud"){
      var isDealer = p === dealerIdx(state,r);
      el.sheetTitle.textContent = state.players[p] + " – hur många tar du?";
      var forbidden = forbiddenBid(state,r,p);
      var laid = bidSum(state,r,p);
      if(forbidden !== null){
        el.sheetSub.className = "sub block";
        el.sheetSub.textContent = "Du ger och bjuder sist. De andra har bjudit " + laid +
          " – därför är " + forbidden + " spärrat (summan skulle bli exakt " + cards + ").";
      } else {
        el.sheetSub.textContent = "Bud lagda hittills: " + laid + " av " + cards + " kort." +
          (isDealer ? " Du ger." : "");
      }
      el.sheetGrid.className = "grid";
      for(var i=0;i<=cards;i++){
        (function(bid){
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = (c && c.b === bid) ? "sel" : "";
          if(bid === forbidden){ btn.disabled = true; btn.title = "Spärrat för given"; }
          var k = document.createElement("span"); k.className = "k";
          k.textContent = bid === 0 ? "nolla" : (bid + " stick");
          var s = document.createElement("span"); s.className = "p"; s.textContent = bid;
          btn.appendChild(s); btn.appendChild(k);
          btn.addEventListener("click", function(){ setBid(r,p,bid); });
          el.sheetGrid.appendChild(btn);
        })(i);
      }
      if(c) addExtra("Rensa rutan", function(){ clearCell(r,p); });
    } else {
      var made = c.b === 0 ? 5 : 10 + c.b;
      el.sheetTitle.textContent = state.players[p] + " bjöd " + c.b;
      el.sheetSub.textContent = "Tog spelaren exakt " + c.b + " stick?";
      el.sheetGrid.className = "grid two";

      var ok = document.createElement("button");
      ok.type = "button";
      ok.className = "made" + (c.m === true ? " sel" : "");
      ok.innerHTML = '<span class="p">' + made + '</span><span class="k">klarade budet</span>';
      ok.addEventListener("click", function(){ setResult(r,p,true); });
      el.sheetGrid.appendChild(ok);

      var no = document.createElement("button");
      no.type = "button";
      no.className = "plump" + (c.m === false ? " sel" : "");
      no.innerHTML = '<span class="p">●</span><span class="k">plump – 0 p</span>';
      no.addEventListener("click", function(){ setResult(r,p,false); });
      el.sheetGrid.appendChild(no);

      addExtra("Ändra bud (" + c.b + ")", function(){ openSheet(r,p,"bud"); });
      addExtra("Rensa rutan", function(){ clearCell(r,p); });
    }

    addExtra("Stäng", closeSheet);
    el.backdrop.hidden = false;
  }

  function addExtra(text, fn){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = text;
    b.addEventListener("click", fn);
    el.sheetExtras.appendChild(b);
  }

  function closeSheet(){ el.backdrop.hidden = true; }

  function remember(r,p){
    var k = key(r,p);
    var prev = state.cells[k];
    history.push({k:k, prev: prev ? {b:prev.b, m:prev.m} : undefined});
    if(history.length > 100) history.shift();
  }

  function setBid(r,p,bid){
    var wasTurn = nextBid(state,r) === p;
    remember(r,p);
    var c = cellOf(state,r,p);
    state.cells[key(r,p)] = { b:bid, m: c ? c.m : null };
    save(); closeSheet(); renderGame();

    // i tur och ordning: gå vidare till nästa spelares bud, stanna när alla
    // bud är lagda så handen kan spelas
    if(wasTurn){
      var nb = nextBid(state,r);
      if(nb !== null) openSheet(r, nb, "bud");
      else toast("Alla bud lagda – spela handen och fyll i resultatet.");
    }
  }

  function setResult(r,p,made){
    var wasTurn = nextResult(state,r) === p;
    remember(r,p);
    var c = cellOf(state,r,p);
    state.cells[key(r,p)] = { b:c.b, m:made };
    save(); closeSheet(); renderGame();

    if(wasTurn){
      var nr = nextResult(state,r);
      if(nr !== null) openSheet(r, nr, "resultat");
    }
  }

  function clearCell(r,p){
    remember(r,p);
    delete state.cells[key(r,p)];
    save(); closeSheet(); renderGame();
  }

  el.backdrop.addEventListener("click", function(e){ if(e.target === el.backdrop) closeSheet(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeSheet(); });

  el.undoBtn.addEventListener("click", function(){
    var h = history.pop();
    if(!h) return;
    if(h.prev === undefined) delete state.cells[h.k];
    else state.cells[h.k] = h.prev;
    save(); closeSheet(); renderGame();
  });

  el.fixBtn.addEventListener("click", function(){
    fixMode = !fixMode;
    toast(fixMode
      ? "Rättningsläge på – du kan ändra alla rundor."
      : "Låst till aktuell runda igen.");
    renderGame();
  });

  el.editBtn.addEventListener("click", function(){
    state.started = false; save();
    showSetup();
  });

  el.newSame.addEventListener("click", function(){
    if(!confirm("Starta ny match med samma spelare?")) return;
    archiveCurrent();
    state.cells = {};
    state.matchId = (state.matchId || 1) + 1;
    history = []; fixMode = false;
    save(); renderGame();
  });

  el.reset.addEventListener("click", function(){
    if(!confirm("Rensa allt och börja om från spelarlistan? Historiken behålls.")) return;
    archiveCurrent();
    var keep = state.archive, id = (state.matchId || 1) + 1;
    state = blank();
    state.archive = keep; state.matchId = id;
    history = []; fixMode = false; save();
    el.maxCards.value = 8; el.minCards.value = 2; el.upAgain.checked = true;
    showSetup();
  });

  /* ---------- start ---------- */
  if(state.rounds.length){
    el.maxCards.value = Math.max.apply(null, state.rounds);
    el.minCards.value = Math.min.apply(null, state.rounds);
  }
  if(state.started && state.rounds.length && state.players.length >= 2){
    renderPlayers();
    renderGame();
  } else {
    showSetup();
  }

  /* ---------- offline ---------- */
  if("serviceWorker" in navigator &&
     (location.protocol === "https:" || location.hostname === "localhost")){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
